<svg viewBox="0 0 680 180" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>三视图覆盖率的实测结果</title>
<desc>飞机本体被三个正交视图覆盖的比例为 80.39%，未覆盖 19.61%。</desc>
<text x="40" y="30" font-size="13.5" font-weight="600" fill="var(--f-ink)">飞机本体：三视图覆盖率实测</text>
<rect x="40" y="48" width="560" height="44" rx="3" fill="var(--f-blue-xl)" stroke="var(--f-blue-line)" stroke-width="0.7"/>
<rect x="40" y="48" width="450" height="44" rx="3" fill="var(--f-blue)"/>
<text x="265" y="76" font-size="17" font-weight="700" fill="var(--f-white)" text-anchor="middle">已覆盖 80.39%</text>
<text x="505" y="76" font-size="15" font-weight="700" fill="var(--f-red)" text-anchor="middle">未覆盖 19.61%</text>
<text x="40" y="118" font-size="12.5" fill="var(--f-ink3)">各视图单独可见比例（三者有重叠，非简单相加）：</text>
<rect x="40" y="130" width="120" height="26" rx="3" fill="var(--f-fill)" stroke="var(--f-line)" stroke-width="0.7"/>
<text x="100" y="148" font-size="12.5" fill="var(--f-ink)" text-anchor="middle">前视 38.8%</text>
<rect x="172" y="130" width="120" height="26" rx="3" fill="var(--f-fill)" stroke="var(--f-line)" stroke-width="0.7"/>
<text x="232" y="148" font-size="12.5" fill="var(--f-ink)" text-anchor="middle">侧视 39.3%</text>
<rect x="304" y="130" width="120" height="26" rx="3" fill="var(--f-fill)" stroke="var(--f-line)" stroke-width="0.7"/>
<text x="364" y="148" font-size="12.5" fill="var(--f-ink)" text-anchor="middle">顶视 43.1%</text>
<text x="440" y="148" font-size="12" fill="var(--f-mute)">共 216,694 个三角面</text>
</svg>