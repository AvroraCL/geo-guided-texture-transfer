<svg viewBox="0 0 680 192" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>路线 C 的六个执行步骤及其性质</title>
<desc>六步依次为渲染视图与提 UV 岛、投影设计稿、构建权重场、标注未覆盖区、推演填充、校验与回改；其中只有第五步属于推演。</desc>
<defs>
<marker id="arS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="25" width="180" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="130" y="45" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">① 渲染视图、提 UV 岛</text>
<text x="130" y="63" font-size="11.5" fill="#8b8b82" text-anchor="middle">算</text>
<path d="M222 51 L244 51" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arS)"/>
<rect x="250" y="25" width="180" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="340" y="45" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">② 投影设计稿</text>
<text x="340" y="63" font-size="11.5" fill="#8b8b82" text-anchor="middle">算</text>
<path d="M432 51 L454 51" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arS)"/>
<rect x="460" y="25" width="180" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="550" y="45" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">③ 构建接缝权重场</text>
<text x="550" y="63" font-size="11.5" fill="#8b8b82" text-anchor="middle">算</text>

<path d="M550 77 L550 91 L130 91 L130 103" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arS)"/>

<rect x="40" y="105" width="180" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="130" y="125" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">④ 标注未覆盖区</text>
<text x="130" y="143" font-size="11.5" fill="#8b8b82" text-anchor="middle">算</text>
<path d="M222 131 L244 131" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arS)"/>
<rect x="250" y="105" width="180" height="52" rx="4" fill="#fbf6ec" stroke="#c8a35a" stroke-width="1.2"/>
<text x="340" y="125" font-size="13" font-weight="600" fill="#8a6d2f" text-anchor="middle">⑤ 推演填充</text>
<text x="340" y="143" font-size="11.5" fill="#8a6d2f" text-anchor="middle">猜 ← 风险都在这</text>
<path d="M432 131 L454 131" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arS)"/>
<rect x="460" y="105" width="180" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="550" y="125" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">⑥ 校验与回改</text>
<text x="550" y="143" font-size="11.5" fill="#8b8b82" text-anchor="middle">算</text>

<text x="340" y="180" font-size="12.5" fill="#5f5e5a" text-anchor="middle">六步之中只有第 5 步需要"猜"；其余五步即使第 5 步做不成，也已构成可用的辅助工具</text>
</svg>