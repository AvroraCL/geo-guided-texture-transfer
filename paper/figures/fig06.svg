<svg viewBox="0 0 680 200" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>正交视图无法覆盖的凹陷区域</title>
<desc>一个带倒扣槽的物体截面。槽口窄、内腔宽，内腔的上下壁在任何正交方向下都被自身遮挡，形成信息缺口。</desc>
<defs>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<path d="M180 50 L340 50 L340 150 L180 150 L180 110 L210 110 L210 130 L270 130 L270 70 L210 70 L210 90 L180 90 Z" fill="#f4f3ef" stroke="#9a9890" stroke-width="1"/>
<line x1="210" y1="70" x2="270" y2="70" stroke="#a32d2d" stroke-width="2.4"/>
<line x1="210" y1="130" x2="270" y2="130" stroke="#a32d2d" stroke-width="2.4"/>
<path d="M115 100 L172 100" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arG)"/>
<path d="M250 20 L250 44" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arG)"/>
<path d="M250 180 L250 156" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arG)"/>
<text x="108" y="90" font-size="12" fill="#5f5e5a" text-anchor="end">左视</text>
<text x="262" y="26" font-size="12" fill="#5f5e5a">俯视</text>
<text x="262" y="186" font-size="12" fill="#5f5e5a">仰视</text>
<text x="372" y="76" font-size="13" font-weight="600" fill="#a32d2d">槽口窄，内腔宽</text>
<text x="372" y="100" font-size="12.5" fill="#5f5e5a">内腔的上下壁</text>
<text x="372" y="120" font-size="12.5" fill="#5f5e5a">在任何正交方向下</text>
<text x="372" y="140" font-size="12.5" fill="#5f5e5a">都被自身遮挡</text>
</svg>