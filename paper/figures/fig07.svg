<svg viewBox="0 0 680 132" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>中间层的三个子问题</title>
<desc>设计稿依次经过对应、延续、合规三个环节转为可用贴图，其中延续环节为难点。</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="14" y="36" width="98" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="63" y="55" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">设计稿</text>
<text x="63" y="73" font-size="11.5" fill="#8b8b82" text-anchor="middle">输入</text>
<path d="M114 62 L146 62" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#ar3)"/>

<rect x="148" y="36" width="98" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="197" y="55" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">对应</text>
<text x="197" y="73" font-size="11.5" fill="#8b8b82" text-anchor="middle">几何问题，有工具</text>
<path d="M248 62 L280 62" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#ar3)"/>

<rect x="282" y="36" width="98" height="52" rx="4" fill="#fbf6ec" stroke="#c8a35a" stroke-width="1.2"/>
<text x="331" y="55" font-size="13" font-weight="600" fill="#8a6d2f" text-anchor="middle">延续</text>
<text x="331" y="73" font-size="11.5" fill="#8a6d2f" text-anchor="middle">推演问题，无成熟解</text>
<path d="M382 62 L414 62" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#ar3)"/>

<rect x="416" y="36" width="98" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="465" y="55" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">合规</text>
<text x="465" y="73" font-size="11.5" fill="#8b8b82" text-anchor="middle">尺寸、通道、可编辑</text>
<path d="M516 62 L548 62" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#ar3)"/>

<rect x="550" y="36" width="116" height="52" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="608" y="55" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">可用贴图</text>
<text x="608" y="73" font-size="11.5" fill="#8b8b82" text-anchor="middle">输出</text>

<text x="331" y="108" font-size="12" fill="#8a6d2f" text-anchor="middle">延续是本文认定的难点：它没有可供计算的输入，只能推演</text>
</svg>