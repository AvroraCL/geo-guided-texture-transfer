<svg viewBox="0 0 680 208" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>算与猜的区别</title>
<desc>左侧为确定性算法，同样的输入永远得到同样的输出；右侧为生成模型，同样的输入每次可能产生不同的输出，存在多种可能。</desc>
<defs>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="60" y="26" font-size="13.5" font-weight="600" fill="#33332f">算：有唯一答案</text>
<rect x="60" y="50" width="88" height="44" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="104" y="72" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">输入</text>
<path d="M150 72 L184 72" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arA)"/>
<rect x="186" y="50" width="104" height="44" rx="4" fill="#eef3f8" stroke="#9db8cf" stroke-width="0.9"/>
<text x="238" y="72" font-size="13" font-weight="600" fill="#1a4b7c" text-anchor="middle">唯一结果</text>
<text x="60" y="118" font-size="12" fill="#5f5e5a">同样的输入，永远得到同样的输出</text>

<text x="370" y="26" font-size="13.5" font-weight="600" fill="#33332f">猜：有多种可能</text>
<rect x="370" y="60" width="76" height="48" rx="4" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<text x="408" y="84" font-size="13" font-weight="600" fill="#33332f" text-anchor="middle">输入</text>
<path d="M448 84 L488 51" fill="none" stroke="#8b8b82" stroke-width="1.2" marker-end="url(#arA)"/>
<path d="M448 84 L488 84" fill="none" stroke="#8b8b82" stroke-width="1.2" marker-end="url(#arA)"/>
<path d="M448 84 L488 117" fill="none" stroke="#8b8b82" stroke-width="1.2" marker-end="url(#arA)"/>
<rect x="490" y="36" width="106" height="30" rx="4" fill="#fbf6ec" stroke="#c8a35a" stroke-width="0.9"/>
<text x="543" y="51" font-size="12.5" fill="#8a6d2f" text-anchor="middle">可能的结果一</text>
<rect x="490" y="69" width="106" height="30" rx="4" fill="#fbf6ec" stroke="#c8a35a" stroke-width="0.9"/>
<text x="543" y="84" font-size="12.5" fill="#8a6d2f" text-anchor="middle">可能的结果二</text>
<rect x="490" y="102" width="106" height="30" rx="4" fill="#fbf6ec" stroke="#c8a35a" stroke-width="0.9"/>
<text x="543" y="117" font-size="12.5" fill="#8a6d2f" text-anchor="middle">可能的结果三</text>
<text x="370" y="148" font-size="12" fill="#5f5e5a">同样的输入，每次跑出来都可能不一样</text>

<rect x="60" y="162" width="560" height="32" rx="4" fill="#f8f7f4" stroke="#e3e1dc" stroke-width="0.6"/>
<text x="76" y="178" font-size="12.5" fill="#4a4a45">几何量必须"算"；只有不存在唯一答案的地方，才该交给"猜"</text>
</svg>