<svg viewBox="0 0 680 196" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>模型拿到的信息与其缺失的对应关系</title>
<desc>左侧为模型实际拿到的平面像素；右侧为三维表面；两者之间的对应关系缺失，需要额外补充。</desc>
<defs>
<marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="60" y="38" font-size="13" font-weight="600" fill="#33332f">模型拿到的</text>
<rect x="60" y="50" width="170" height="90" rx="3" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<path d="M117 50 V140 M174 50 V140 M60 80 H230 M60 110 H230" fill="none" stroke="#ddd9d0" stroke-width="0.8"/>
<text x="145" y="152" font-size="12" fill="#5f5e5a" text-anchor="middle">一堆格子上的颜色值</text>

<path d="M232 95 L286 95" fill="none" stroke="#8b8b82" stroke-width="1.3" marker-end="url(#arN)"/>
<text x="310" y="96" font-size="26" font-weight="600" fill="#a32d2d" text-anchor="middle">?</text>
<path d="M334 95 L376 95" fill="none" stroke="#8b8b82" stroke-width="1.3"/>
<text x="305" y="130" font-size="12" fill="#a32d2d" text-anchor="middle">对应关系缺失</text>

<text x="380" y="38" font-size="13" font-weight="600" fill="#33332f">它不知道的</text>
<rect x="380" y="50" width="170" height="90" rx="3" fill="#f4f3ef" stroke="#c9c7be" stroke-width="0.7"/>
<path d="M400 120 Q 465 68 530 120" fill="none" stroke="#1a4b7c" stroke-width="1.8"/>
<path d="M432 106 L432 84" fill="none" stroke="#1a4b7c" stroke-width="1.2" marker-end="url(#arN)"/>
<path d="M465 94 L465 72" fill="none" stroke="#1a4b7c" stroke-width="1.2" marker-end="url(#arN)"/>
<path d="M498 106 L498 84" fill="none" stroke="#1a4b7c" stroke-width="1.2" marker-end="url(#arN)"/>
<text x="465" y="152" font-size="12" fill="#5f5e5a" text-anchor="middle">这些格子在空间里的位置与朝向</text>

<rect x="60" y="164" width="560" height="28" rx="4" fill="#f8f7f4" stroke="#e3e1dc" stroke-width="0.6"/>
<text x="76" y="178" font-size="12.5" fill="#4a4a45">表面感知的位置信息，补的就是中间那个问号</text>
</svg>